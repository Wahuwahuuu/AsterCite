name: 文档日期更新

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-doc-date.yml'
  schedule:
    - cron: '17 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-doc-date
  cancel-in-progress: false

jobs:
  update:
    if: github.repository_owner == 'Wahuwahuuu' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 更新文档日期
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_AUTHOR_NAME: Wahuwahuuu
          GH_AUTHOR_EMAIL: 162968262+Wahuwahuuu@users.noreply.github.com
        run: |
          python3 - <<'PY'
          import base64
          import datetime as dt
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from zoneinfo import ZoneInfo
          
          FOOTER = re.compile(r"(?m)^<sub>文档更新日期：\d{4}-\d{2}-\d{2}。</sub>[ \t]*(?=\r?$)")
          ALLOWED = {"Wahuwahuuu/AsterCite", "Wahuwahuuu/interview-knowledge-cards"}
          
          def update_document(text, day):
              line = f"<sub>文档更新日期：{day}。</sub>"
              matches = list(FOOTER.finditer(text))
              if len(matches) > 1:
                  raise ValueError("文档日期出现多次，请人工核对")
              if matches:
                  return FOOTER.sub(line, text, count=1)
              if "文档更新日期：" in text:
                  raise ValueError("已有日期说明格式不同，请人工核对")
              newline = "\r\n" if "\r\n" in text else "\n"
              return text.rstrip("\r\n") + newline * 2 + line + newline
          
          def main():
              repo = os.environ["GH_REPOSITORY"]
              if repo not in ALLOWED:
                  raise ValueError("当前仓库不在任务范围内")
              branch = os.environ["GH_DEFAULT_BRANCH"]
              day = dt.datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat()
              url = os.environ["GH_API_URL"].rstrip("/") + "/repos/" + repo + "/contents/README.md"
              headers = {
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "documentation-date",
              }
          
              def request(method, target, payload=None):
                  data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode("utf-8")
                  req = urllib.request.Request(target, data=data, headers=headers, method=method)
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
          
              for attempt in range(4):
                  try:
                      current = request("GET", url + "?" + urllib.parse.urlencode({"ref": branch}))
                      text = base64.b64decode(current["content"]).decode("utf-8")
                      updated = update_document(text, day)
                      if updated == text:
                          print(f"文档日期已为 {day}，跳过重复提交。")
                          return
                      result = request("PUT", url, {
                          "message": f"文档：更新文档日期至 {day}",
                          "content": base64.b64encode(updated.encode("utf-8")).decode("ascii"),
                          "sha": current["sha"],
                          "branch": branch,
                          "author": {
                              "name": os.environ["GH_AUTHOR_NAME"],
                              "email": os.environ["GH_AUTHOR_EMAIL"],
                          },
                      })
                      print("文档日期已更新：" + result["commit"]["sha"])
                      return
                  except urllib.error.HTTPError as error:
                      if error.code in (409, 422, 429, 500, 502, 503, 504) and attempt < 3:
                          print(f"提交暂未完成（HTTP {error.code}），重新读取后重试。")
                          time.sleep(2 ** attempt)
                          continue
                      raise
          
          if __name__ == "__main__":
              main()
          PY
